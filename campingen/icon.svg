<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#2d3d36"/>
  <!-- Caravan body -->
  <path d="M 80 180 C 80 140 120 120 160 120 L 380 120 C 430 120 460 150 460 200 L 460 360 C 460 370 450 380 440 380 L 100 380 C 90 380 80 370 80 360 Z" fill="#e5eae8" stroke="#1b437c" stroke-width="12"/>
  <!-- Classic blue speed stripe -->
  <path d="M 80 270 L 460 270 L 460 310 L 80 310 Z" fill="#1b437c"/>
  <path d="M 80 315 L 460 315 L 460 325 L 80 325 Z" fill="#e69500"/>
  <!-- Caravan window -->
  <rect x="130" y="150" width="120" height="90" rx="10" fill="#1c252d" stroke="#1b437c" stroke-width="8"/>
  <rect x="280" y="150" width="140" height="90" rx="10" fill="#1c252d" stroke="#1b437c" stroke-width="8"/>
  <!-- Wheel & hitch -->
  <circle cx="270" cy="380" r="45" fill="#1c252d" stroke="#e5eae8" stroke-width="8"/>
  <circle cx="270" cy="380" r="20" fill="#e69500"/>
  <path d="M 440 360 L 490 380" stroke="#1b437c" stroke-width="14" stroke-linecap="round"/>
  <!-- Text KNAUS 3000 -->
  <text x="256" y="470" font-family="sans-serif" font-weight="900" font-size="44" fill="#e5eae8" text-anchor="middle" letter-spacing="4">KNAUS 3000</text>
</svg>
